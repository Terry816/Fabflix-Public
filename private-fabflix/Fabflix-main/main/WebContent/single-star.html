<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fabflix - Star Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/fabflix-style.css">

    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', sans-serif;
        }
        .star-name {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e50914;
        }
        .star-info {
            background-color: #1f1f1f;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        table {
            background-color: #1f1f1f;
        }
        a {
            color: #80cbc4;
        }
        a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .back-button {
            display: inline-block;
            padding: 10px 16px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }
        .back-button:hover {
            background-color: #b20710;
            transform: scale(1.05);
        }
        .back-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">
        <img src="images/fabflix-logo.png" alt="Fabflix Logo">
        Fabflix
    </a>

    <form class="form-inline mx-auto" onsubmit="return false;">
        <input id="nav-autocomplete" type="text" class="form-control mr-sm-2"
               placeholder="Search Movies..." autocomplete="off" />
        <button id="nav-search-button" class="btn btn-outline-light" type="button">
            <i class="fas fa-search"></i>
        </button>
    </form>


    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ml-auto" id="navbar-buttons"></ul>
    </div>
</nav>


<div class="container mt-5">

    <!-- Back Button -->
    <div class="text-left">
        <button id="backButton" class="back-button" onclick="goBack()">← Back</button>
    </div>

    <div class="star-info">
        <div id="star_info" class="mb-4"></div>

        <table class="table table-striped text-light">
            <thead>
            <tr>
                <th>Movie Title</th>
                <th>Release Year</th>
                <th>Director</th>
                <th>Cart</th>
            </tr>
            </thead>
            <tbody id="movie_table_body"></tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/app-utils.js"></script>
<script src="single-star.js"></script>

<script>
    function goBack() {
        goBackOrFallback("movie-list.html");
    }

    window.onload = function () {
        hideBackButtonWithoutHistory("backButton");
    };
</script>
<script src="navbar.js"></script>
<script>
    reloadOnHistoryNavigation();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>
<script src="autocomplete.js"></script>
</body>
</html>
