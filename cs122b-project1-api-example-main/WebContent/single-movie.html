<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fabflix - Movie Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/fabflix-style.css">

    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', sans-serif;
        }
        .movie-title {
            font-size: 3rem;
            font-weight: 700;
            color: #e50914;
        }
        .movie-info {
            background-color: #1f1f1f;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .metadata p {
            margin: 0.3rem 0;
        }
        table {
            background-color: #1f1f1f;
        }
        a {
            color: #80cbc4;
        }
        a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .back-button {
            display: inline-block;
            padding: 10px 16px;
            background-color: #e50914; /* Netflix red-style */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .back-button:hover {
            background-color: #b20710;
            transform: scale(1.05);
        }

        .back-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">
        <img src="images/fabflix-logo.png" alt="Fabflix Logo">
        Fabflix
    </a>

    <form class="form-inline mx-auto" onsubmit="return false;">
        <input id="nav-autocomplete" type="text" class="form-control mr-sm-2"
               placeholder="Search Movies..." autocomplete="off" />
        <button id="nav-search-button" class="btn btn-outline-light" type="button">
            <i class="fas fa-search"></i>
        </button>
    </form>


    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ml-auto" id="navbar-buttons"></ul>
    </div>
</nav>


<div class="container mt-5">
    <!-- Back Button -->
    <div class="text-left">
        <button id="backButton" class="back-button" onclick="goBack()">← Back</button>
    </div>

    <div class="movie-info">
        <div id="movie_info" class="mb-4"></div>

        <!-- Add to Cart Button -->
        <div class="text-center mb-4">
            <button id="add-to-cart-btn" class="btn btn-sm btn-success">
                Add to Cart
            </button>
        </div>

        <table class="table table-striped text-light mt-4">
            <thead>
            <tr>
                <th>Genres</th>
                <th>Stars</th>
            </tr>
            </thead>
            <tbody id="movie_detail_table"></tbody>
        </table>
    </div>
</div>

<!-- JS -->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="single-movie.js"></script>
<script>
    function goBack() {
        if (document.referrer && window.history.length > 1) {
            window.history.back();
        } else {
            // Optional: fallback to homepage or movie list
            window.location.href = "movie-list.html";
        }
    }

    // Only show button if we have history or a referring page
    window.onload = function () {
        const backBtn = document.getElementById("backButton");
        if (!document.referrer || window.history.length <= 1) {
            backBtn.style.display = "none";
        }
    };
</script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="single-movie.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="navbar.js"></script>
<script>
    // If the user uses the Back button after logout, force a reload to trigger LoginFilter
    window.addEventListener("pageshow", function (event) {
        if (event.persisted || window.performance.getEntriesByType("navigation")[0].type === "back_forward") {
            window.location.reload();
        }
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>
<script src="autocomplete.js"></script>
</body>
</html>
