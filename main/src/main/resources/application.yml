server:
  port: ${PORT:8080}

spring:
  application:
    name: fabflix
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moviedb}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-secret-of-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-secure: ${COOKIE_SECURE:false}
